---
- name: Check the lab route service
  ansible.builtin.stat:
    path: /etc/systemd/system/kali-purple-lab-route.service
  register: lab_route_service

- name: Check whether the lab route configuration will change
  ansible.builtin.template:
    src: lab-route.service.j2
    dest: /etc/systemd/system/kali-purple-lab-route.service
    owner: root
    group: root
    mode: "0644"
  check_mode: true
  register: lab_route_preview
  when:
    - lab_gateway is defined
    - lab_route_service.stat.exists

- name: Remove the old lab route before replacing or disabling it
  ansible.builtin.systemd_service:
    name: kali-purple-lab-route.service
    state: stopped
    enabled: false
  when:
    - lab_route_service.stat.exists
    - lab_gateway is undefined or lab_route_preview.changed

- name: Configure and start the route through OPNsense
  when: lab_gateway is defined
  block:
    - name: Install the lab route service
      ansible.builtin.template:
        src: lab-route.service.j2
        dest: /etc/systemd/system/kali-purple-lab-route.service
        owner: root
        group: root
        mode: "0644"
      register: lab_route_unit

    - name: Enable the lab route on this boot and future boots
      ansible.builtin.systemd_service:
        name: kali-purple-lab-route.service
        daemon_reload: "{{ lab_route_unit.changed }}"
        enabled: true
        state: started

- name: Remove the unused lab route service
  when:
    - lab_gateway is undefined
    - lab_route_service.stat.exists
  block:
    - name: Remove the lab route unit file
      ansible.builtin.file:
        path: /etc/systemd/system/kali-purple-lab-route.service
        state: absent

    - name: Reload systemd after removing the lab route unit
      ansible.builtin.systemd_service:
        daemon_reload: true
