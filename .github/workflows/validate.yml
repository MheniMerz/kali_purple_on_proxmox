name: Validate lab configuration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly -input=false
      - run: terraform validate
      - run: terraform test

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r ansible/requirements.txt
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: ansible-playbook --syntax-check ansible/site.yml ansible/verify.yml
